name: Feature Request
description: 提一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
    - type: textarea
      id: problem
      attributes:
          label: 这个需求想解决什么问题
          description: 尽量描述场景而不是直接给方案，方便一起讨论更合适的实现方式
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: 期望的方案（可选）
      validations:
          required: false

    - type: textarea
      id: alternatives
      attributes:
          label: 考虑过的其他方案（可选）
      validations:
          required: false
